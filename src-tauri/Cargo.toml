[package]
name = "data-explorer"
version = "0.1.0"
description = "Data Explorer - Analiza archivos JSON, CSV, Parquet y más"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
thiserror = "2"
chrono = "0.4"
polars = { version = "0.45", features = ["parquet", "csv", "json", "lazy", "strings", "dtype-full", "dtype-date", "dtype-datetime", "dtype-time", "rows", "dtype-decimal", "sql"] }
calamine = "0.26"
uuid = { version = "1", features = ["v4"] }
aws-sdk-s3 = "1"
aws-config = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[dev-dependencies]
polars = "0.45"
